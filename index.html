<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <link rel="shortcut icon" href="https://cdn.iconscout.com/icon/free/png-256/free-code-forces-logo-icon-svg-download-png-2944796.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF Dashboard | Shinobi Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class', // Locked to dark mode for the Naruto theme
            theme: {
                extend: {
                    colors: {
                        orange: {
                            400: '#ff8c00', // vibrant accent
                            500: '#ff6600', // primary naruto orange
                            600: '#e65c00', // hover states
                            700: '#cc5200', 
                        },
                        gray: {
                            850: '#141414', // card background
                            900: '#0a0a0a', // body background
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: 0, transform: 'translateY(10px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #d1d5db;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff6600; }

        .card {
            background-color: #141414;
            border: 1px solid rgba(255, 102, 0, 0.15); /* Subtle orange border */
            border-radius: 0.75rem;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease-in-out;
        }
        .card:hover {
            border-color: rgba(255, 102, 0, 0.4);
            box-shadow: 0 8px 25px -2px rgba(255, 102, 0, 0.1);
        }

        #progress-bar { transition: width 0.3s ease-in-out; }
        
        .form-input {
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: white;
        }
        .form-input:focus {
             outline: none;
             border-color: #ff6600;
             box-shadow: 0 0 0 2px rgba(255, 102, 0, 0.3);
        }
        
        .sortable:hover { background-color: #1f1f1f; }
        .sort-icon { opacity: 0.5; transition: opacity 0.2s ease-in-out; }
        .sortable:hover .sort-icon { opacity: 1; }
        .sort-icon.active { opacity: 1; color: #ff6600; }
        
        .clickable-tag { cursor: pointer; transition: all 0.2s; }
        .clickable-tag:hover { background-color: #ff6600; color: white; }
        
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
        }
    </style>
</head>
<body class="antialiased">

    <div class="container mx-auto p-4 md:p-8">
        <!-- Header -->
        <header class="mb-10">
            <div class="flex justify-between items-center mb-4">
                 <h1 class="text-3xl md:text-4xl font-extrabold text-white flex items-center gap-3">
                    <span class="text-orange-500">忍</span> 
                    CF Dashboard <span class="text-orange-500 glow-text hidden sm:inline">Shinobi</span>
                 </h1>
            </div>
            <div id="mini-profile-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </header>

        <main class="grid grid-cols-1">
             <!-- Control Panel Full Width -->
            <div class="card p-6 mb-8">
                <h2 class="text-xl font-bold text-white mb-4 border-b border-orange-500/20 pb-3 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    Mission Parameters
                </h2>
                <form id="control-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4 items-end">
                    <div class="lg:col-span-1"><label for="contest-division" class="block text-sm font-medium text-gray-400">Division</label>
                        <select id="contest-division" name="contest-division" class="mt-1 block w-full pl-3 pr-10 py-2 text-base rounded-md form-input">
                            <option>Div. 1</option>
                            <option selected>Only Div. 2</option>
                            <option>All Div. 2</option>
                            <option>Div. 3</option>
                            <option>Div. 4</option>
                            <option>Div. 1 + Div. 2</option>
                            <option>Educational</option>
                            <option>CodeTON</option>
                            <option>Global</option>
                            <option>Kotlin</option>
                            <option>VK Cup</option>
                        </select>
                    </div>
                    <div class="lg:col-span-1"><label for="problem-number" class="block text-sm font-medium text-gray-400">Index</label>
                        <select id="problem-number" name="problem-number" class="mt-1 block w-full pl-3 pr-10 py-2 text-base rounded-md form-input">
                            <option>A</option><option>B</option><option>C</option><option selected>D</option><option>E</option><option>F</option><option>G</option><option>H</option><option>I</option><option>J</option>
                        </select>
                    </div>
                    <div class="lg:col-span-1"><label for="num-contests" class="block text-sm font-medium text-gray-400">Problems</label>
                        <input type="number" name="num-contests" id="num-contests" value="50" class="mt-1 block w-full shadow-sm sm:text-sm rounded-md form-input">
                    </div>
                    <div class="lg:col-span-1"><label for="handle" class="block text-sm font-medium text-gray-400">Your Handle</label>
                        <input type="text" name="handle" id="handle" placeholder="e.g., tourist" class="mt-1 block w-full shadow-sm sm:text-sm rounded-md form-input text-orange-400 font-bold tracking-wide">
                    </div>
                    <div class="lg:col-span-1"><label for="compare-handle" class="block text-sm font-medium text-gray-400">Rival Handle</label>
                        <input type="text" name="compare-handle" id="compare-handle" placeholder="e.g., Petr" class="mt-1 block w-full shadow-sm sm:text-sm rounded-md form-input">
                    </div>
                    <div class="lg:col-span-1 grid grid-cols-2 gap-2">
                        <button type="submit" id="submit-btn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-orange-500 hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-orange-500 transition-colors">Fetch</button>
                        <button type="button" id="reset-cache-btn" class="w-full flex justify-center py-2 px-4 border border-gray-600 rounded-md shadow-sm text-sm font-medium text-gray-300 bg-gray-800 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-gray-500 transition-colors">Reset</button>
                    </div>
                </form>
            </div>

            <!-- Analytical Part -->
            <div id="analytics-grid" class="grid grid-cols-1 gap-8">
                <!-- User 1 Analytics -->
                <div id="analytics-user1" class="space-y-8 hidden animate-fade-in"></div>
                <!-- User 2 Analytics -->
                <div id="analytics-user2" class="space-y-8 hidden animate-fade-in"></div>
            </div>

            <!-- Right Column: Problem List -->
            <section class="mt-8">
                <div class="card overflow-hidden">
                    <div class="p-2 sm:p-6">
                        <!-- Filters -->
                        <div id="filters-container" class="mb-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 hidden">
                            <input type="text" id="tag-filter" placeholder="Filter by tag..." class="form-input rounded-md sm:col-span-2 md:col-span-1">
                            <select id="verdict-filter" class="form-input rounded-md">
                                <option value="">All Verdicts</option>
                                <option value="Solved">Solved</option>
                                <option value="Not Attempted">Not Attempted</option>
                                <option value="WRONG ANSWER">Wrong Answer</option>
                            </select>
                            <input type="number" id="rating-min-filter" placeholder="Min Rating" class="form-input rounded-md">
                            <input type="number" id="rating-max-filter" placeholder="Max Rating" class="form-input rounded-md">
                        </div>
                        
                        <div id="initial-message" class="text-center py-20">
                            <svg class="mx-auto h-16 w-16 text-orange-500/50 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                            <h3 class="mt-2 text-xl font-bold text-white">Awaiting Orders</h3>
                            <p class="mt-1 text-sm text-gray-400">Enter your handle to begin your training.</p>
                        </div>
                        
                        <div id="loader-container" class="text-center py-20 hidden">
                            <div class="w-full bg-gray-800 rounded-full h-2 mb-4 overflow-hidden">
                                <div id="progress-bar" class="bg-orange-500 h-2 rounded-full relative" style="width: 0%">
                                    <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
                                </div>
                            </div>
                            <p id="progress-text" class="mt-4 text-sm font-medium text-orange-400 animate-pulse">Gathering Intel...</p>
                        </div>
                        
                        <div id="error-message" class="text-center py-20 hidden">
                            <svg class="mx-auto h-12 w-12 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                            </svg>
                            <h3 class="mt-2 text-lg font-bold text-red-500">Mission Failed</h3>
                            <p class="mt-1 text-sm text-red-400" id="error-text"></p>
                        </div>
                        
                        <div id="table-container" class="hidden overflow-x-auto">
                           <table class="min-w-full divide-y divide-gray-800">
                                <thead id="problem-table-head" class="bg-gray-900/50"></thead>
                                <tbody id="problem-table-body" class="divide-y divide-gray-800"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // DOM Elements
        const controlForm = document.getElementById('control-form');
        const submitBtn = document.getElementById('submit-btn');
        const resetCacheBtn = document.getElementById('reset-cache-btn');
        const initialMessage = document.getElementById('initial-message');
        const loaderContainer = document.getElementById('loader-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const tableContainer = document.getElementById('table-container');
        const problemTableHead = document.getElementById('problem-table-head');
        const problemTableBody = document.getElementById('problem-table-body');
        const analyticsGrid = document.getElementById('analytics-grid');
        const analyticsUser1 = document.getElementById('analytics-user1');
        const analyticsUser2 = document.getElementById('analytics-user2');
        const filtersContainer = document.getElementById('filters-container');
        const tagFilterInput = document.getElementById('tag-filter');
        const verdictFilterInput = document.getElementById('verdict-filter');
        const ratingMinInput = document.getElementById('rating-min-filter');
        const ratingMaxInput = document.getElementById('rating-max-filter');
        const miniProfileContainer = document.getElementById('mini-profile-container');

        let charts = {};
        
        // --- App State ---
        let allProblems = [];
        let userData = {};
        let currentProblemSelection = [];
        
        // --- Settings Management ---
        let settings = {
            handle: '', compareHandle: '', division: 'Only Div. 2', problemIndex: 'D', count: 50,
            filters: { tag: '', verdict: '', ratingMin: '', ratingMax: '' },
            sort: { column: 'startTimeSeconds', direction: 'desc' }
        };

        const saveSettings = () => localStorage.setItem('cfDashboardSettingsNaruto', JSON.stringify(settings));
        const loadSettings = () => {
            const saved = localStorage.getItem('cfDashboardSettingsNaruto');
            if (saved) settings = { ...settings, ...JSON.parse(saved) };
            
            document.getElementById('handle').value = settings.handle;
            document.getElementById('compare-handle').value = settings.compareHandle;
            document.getElementById('contest-division').value = settings.division;
            document.getElementById('problem-number').value = settings.problemIndex;
            document.getElementById('num-contests').value = settings.count;
            Object.keys(settings.filters).forEach(key => {
                const inputId = `${key.replace('ratingMin', 'rating-min').replace('ratingMax', 'rating-max')}-filter`;
                const input = document.getElementById(inputId);
                if (input) input.value = settings.filters[key];
            });
        };

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', loadSettings);

        controlForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            settings.division = document.getElementById('contest-division').value;
            settings.problemIndex = document.getElementById('problem-number').value;
            settings.count = parseInt(document.getElementById('num-contests').value, 10);
            settings.handle = document.getElementById('handle').value.trim();
            settings.compareHandle = document.getElementById('compare-handle').value.trim();
            
            if (!settings.handle) {
                showError('Your Handle is required to start the mission.');
                return;
            }
            settings.sort = { column: 'startTimeSeconds', direction: 'desc' };
            saveSettings();
            await fetchData();
        });

        resetCacheBtn.addEventListener('click', () => {
            const keysToKeep = ['cfDashboardSettingsNaruto'];
            for (let i = localStorage.length - 1; i >= 0; i--) {
                const key = localStorage.key(i);
                if (!keysToKeep.includes(key)) localStorage.removeItem(key);
            }
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/80 flex items-center justify-center z-50';
            modal.innerHTML = `<div class="bg-gray-900 border border-orange-500 text-white p-6 rounded-lg shadow-[0_0_20px_rgba(255,102,0,0.4)] font-bold">Local Intel Cleared!</div>`;
            document.body.appendChild(modal);
            setTimeout(() => modal.remove(), 1500);
        });
        
        const addSortListeners = () => {
             document.querySelectorAll('.sortable').forEach(header => {
                header.addEventListener('click', () => {
                    const sortColumn = header.dataset.sort;
                    if (settings.sort.column === sortColumn) {
                        settings.sort.direction = settings.sort.direction === 'asc' ? 'desc' : 'asc';
                    } else {
                        settings.sort.column = sortColumn;
                        settings.sort.direction = 'asc';
                    }
                    saveSettings();
                    applyFiltersAndRender();
                });
            });
        }

        [tagFilterInput, verdictFilterInput, ratingMinInput, ratingMaxInput].forEach(el => {
            el.addEventListener('input', () => {
                settings.filters.tag = tagFilterInput.value.toLowerCase();
                settings.filters.verdict = verdictFilterInput.value;
                settings.filters.ratingMin = ratingMinInput.value;
                settings.filters.ratingMax = ratingMaxInput.value;
                saveSettings();
                applyFiltersAndRender();
            });
        });

        // --- Helper functions ---
        function formatDate(unixSeconds) {
            if (!unixSeconds) return '';
            const date = new Date(unixSeconds * 1000);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        // --- UI State Functions ---
        function showLoading() {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Fetching';
            initialMessage.classList.add('hidden');
            errorMessage.classList.add('hidden');
            tableContainer.classList.add('hidden');
            analyticsUser1.classList.add('hidden');
            analyticsUser2.classList.add('hidden');
            filtersContainer.classList.add('hidden');
            miniProfileContainer.innerHTML = '';
            loaderContainer.classList.remove('hidden');
        }
        
        function updateProgress(value, text) { progressBar.style.width = `${value}%`; progressText.textContent = text; }
        function showSuccess() {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Fetch';
            loaderContainer.classList.add('hidden');
            tableContainer.classList.remove('hidden');
            analyticsUser1.classList.remove('hidden');
            if (settings.compareHandle) analyticsUser2.classList.remove('hidden');
            filtersContainer.classList.remove('hidden');
        }
        function showError(message) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Fetch';
            loaderContainer.classList.add('hidden');
            initialMessage.classList.add('hidden');
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        // --- Core Data Fetching and Caching Logic ---
        async function fetchFromCacheOrApi(key, url, expiry, transformFn = null) {
            const cached = localStorage.getItem(key);
            if (cached) {
                try {
                    const { timestamp, data } = JSON.parse(cached);
                    if (Date.now() - timestamp < expiry) return data;
                } catch(e) { localStorage.removeItem(key); }
            }
            const response = await fetch(url).then(res => res.json());
            if (response.status !== 'OK') throw new Error(response.comment);
            
            const dataToCache = transformFn ? transformFn(response.result) : response.result;
            
            try { 
                localStorage.setItem(key, JSON.stringify({ timestamp: Date.now(), data: dataToCache })); 
            } catch (e) { 
                console.warn("Storage Quota Exceeded. Clearing old intel to make space...");
                // Free up space by clearing older cf_ caches
                for (let i = localStorage.length - 1; i >= 0; i--) {
                    const k = localStorage.key(i);
                    if (k && k.startsWith('cf_')) localStorage.removeItem(k);
                }
                // Retry caching once after cleanup
                try {
                    localStorage.setItem(key, JSON.stringify({ timestamp: Date.now(), data: dataToCache }));
                } catch(err) {
                    console.warn("Storage still full. Proceeding without caching for: " + key);
                }
            }
            return dataToCache;
        }
        
        async function fetchUserData(handle, progressStart, progressEnd) {
            const day = 24 * 60 * 60 * 1000;
            const tenMins = 10 * 60 * 1000;
            updateProgress(progressStart, `Locating Ninja: ${handle}...`);
            const userInfo = (await fetchFromCacheOrApi(`cf_user_${handle}`, `https://codeforces.com/api/user.info?handles=${handle}`, day))[0];
            updateProgress(progressStart + (progressEnd - progressStart) / 2, `Extracting Mission Logs for ${handle}...`);
            
            // Trim submissions to avoid localStorage QuotaExceededError
            const submissions = await fetchFromCacheOrApi(
                `cf_submissions_${handle}`, 
                `https://codeforces.com/api/user.status?handle=${handle}&from=1&count=10000`, 
                tenMins,
                (data) => data.map(sub => ({
                    problem: { contestId: sub.problem.contestId, index: sub.problem.index },
                    verdict: sub.verdict,
                    creationTimeSeconds: sub.creationTimeSeconds
                }))
            );
            return { userInfo, submissions };
        }

        async function fetchData() {
            showLoading();
            const day = 24 * 60 * 60 * 1000;
            
            try {
                updateProgress(5, 'Connecting to Global Network...');
                const contestList = await fetchFromCacheOrApi('cf_contests', 'https://codeforces.com/api/contest.list', day);
                
                // Trim problemset to save substantial local storage space
                const problemset = await fetchFromCacheOrApi('cf_problemset', 'https://codeforces.com/api/problemset.problems', day, (data) => ({
                    problems: data.problems.map(p => ({
                        contestId: p.contestId,
                        index: p.index,
                        name: p.name,
                        tags: p.tags,
                        rating: p.rating
                    }))
                }));
                
                const handles = [settings.handle];
                if(settings.compareHandle) handles.push(settings.compareHandle);

                const userPromises = handles.map((h, i) => fetchUserData(h, 20 + i*40, 60 + i*40));
                const results = await Promise.all(userPromises);
                
                handles.forEach((h, i) => userData[h] = results[i]);

                updateProgress(95, 'Synthesizing Data...');
                const contestMap = new Map();
                contestList.forEach(c => c.phase === "FINISHED" && contestMap.set(c.id, c));
                
                allProblems = problemset.problems.map((p, i) => {
                    const contest = contestMap.get(p.contestId);
                    if (!contest) return null;
                    return {
                        ...p,
                        contestName: contest.name,
                        startTimeSeconds: contest.startTimeSeconds
                    }
                }).filter(p => p !== null);
                
                processAndRenderData();
            } catch (err) {
                console.error(err);
                showError(err.message);
            }
        }
        
        function processAndRenderData() {
            Object.keys(userData).forEach(handle => {
                const submissionMap = new Map();
                // Submissions are usually newest to oldest. 
                // We want to record the earliest Solved date, or latest fail.
                userData[handle].submissions.forEach(sub => {
                    const key = `${sub.problem.contestId}-${sub.problem.index}`;
                    const current = submissionMap.get(key);

                    if (sub.verdict === 'OK') {
                        // Keep the oldest/earliest solve date
                        if (!current || current.verdict !== 'Solved' || sub.creationTimeSeconds < current.solvedDate) {
                            submissionMap.set(key, { verdict: 'Solved', solvedDate: sub.creationTimeSeconds });
                        }
                    } else if (sub.verdict && (!current || current.verdict !== 'Solved')) {
                        // If not solved yet, keep track of the attempt
                        if(!current) {
                            submissionMap.set(key, { verdict: sub.verdict.replace(/_/g, ' '), solvedDate: null });
                        }
                    }
                });
                userData[handle].submissionMap = submissionMap;
            });

            const filteredProblems = allProblems.filter(p => {
                const contestName = p.contestName.toLowerCase();
                const division = settings.division.toLowerCase();
                let contestMatch = false;
                
                if (division === 'all div. 2') {
                    contestMatch = contestName.includes('div. 2');
                } else if (division === 'only div. 2') {
                    contestMatch = contestName.includes('div. 2') && !contestName.includes('div. 1') && !contestName.includes('educational');
                } else if (division === 'div. 1 + div. 2') {
                    contestMatch = contestName.includes('div. 1') && contestName.includes('div. 2');
                } else {
                    contestMatch = contestName.includes(division);
                }
                
                return p.index === settings.problemIndex && contestMatch;
            });
            
            currentProblemSelection = filteredProblems.slice(0, settings.count);

            renderUI();
            showSuccess();
            updateProgress(100, 'Mission Ready!');
        }
        
        function renderUI() {
            miniProfileContainer.innerHTML = '';
            
            if (settings.compareHandle) {
                analyticsGrid.className = 'grid lg:grid-cols-2 gap-8';
                renderMiniProfile(settings.handle, miniProfileContainer);
                renderAnalyticsForUser(settings.handle, analyticsUser1);
                renderMiniProfile(settings.compareHandle, miniProfileContainer);
                renderAnalyticsForUser(settings.compareHandle, analyticsUser2);
            } else {
                 analyticsGrid.className = 'grid grid-cols-1 gap-8 max-w-4xl mx-auto';
                 renderMiniProfile(settings.handle, miniProfileContainer);
                 renderAnalyticsForUser(settings.handle, analyticsUser1);
                 analyticsUser2.innerHTML = '';
                 analyticsUser2.classList.add('hidden');
            }
            
            renderTableHead();
            applyFiltersAndRender();
        }

        function applyFiltersAndRender() {
            const { tag, verdict, ratingMin, ratingMax } = settings.filters;
            const filtered = currentProblemSelection.filter(p => {
                const pVerdictObj = userData[settings.handle]?.submissionMap.get(`${p.contestId}-${p.index}`) || { verdict: 'Not Attempted' };
                const pVerdict = pVerdictObj.verdict;
                return (!tag || (p.tags && p.tags.join(',').toLowerCase().includes(tag))) &&
                       (!verdict || pVerdict === verdict) &&
                       (!ratingMin || (p.rating || 0) >= parseInt(ratingMin, 10)) &&
                       (!ratingMax || (p.rating || 0) <= parseInt(ratingMax, 10));
            });
            sortAndRenderProblems(filtered);
        }

        function sortAndRenderProblems(problems) {
            const { column, direction } = settings.sort;
            problems.sort((a, b) => {
                let valA, valB;
                if (column === 'verdict') { 
                    valA = (userData[settings.handle].submissionMap.get(`${a.contestId}-${a.index}`) || {}).verdict || 'Not Attempted'; 
                    valB = (userData[settings.handle].submissionMap.get(`${b.contestId}-${b.index}`) || {}).verdict || 'Not Attempted'; 
                } 
                else { valA = a[column]; valB = b[column]; }
                if (valA < valB) return direction === 'asc' ? -1 : 1;
                if (valA > valB) return direction === 'asc' ? 1 : -1;
                return 0;
            });

            renderProblemTable(problems);
            updateSortIcons();
        }

        // --- Rendering Functions ---
        function renderTableHead() {
             let headHTML = `<tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider sortable cursor-pointer" data-sort="startTimeSeconds"><div class="flex items-center">Contest & Date<span class="ml-2 sort-icon"></span></div></th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider sortable cursor-pointer" data-sort="name"><div class="flex items-center">Problem<span class="ml-2 sort-icon"></span></div></th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider">Jutsu / Tags</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider sortable cursor-pointer" data-sort="rating"><div class="flex items-center">Rank<span class="ml-2 sort-icon"></span></div></th>`;
            
            if (settings.compareHandle) {
                headHTML += `<th scope="col" class="px-6 py-3 text-left text-xs font-bold text-orange-400 uppercase tracking-wider">${settings.handle}</th>`;
                headHTML += `<th scope="col" class="px-6 py-3 text-left text-xs font-bold text-red-400 uppercase tracking-wider">${settings.compareHandle}</th>`;
            } else {
                 headHTML += `<th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider sortable cursor-pointer" data-sort="verdict"><div class="flex items-center">Status<span class="ml-2 sort-icon"></span></div></th>`;
            }

            headHTML += `</tr>`;
            problemTableHead.innerHTML = headHTML;
            addSortListeners();
        }

        function renderProblemTable(problems) {
            problemTableBody.innerHTML = problems.length === 0 
                ? `<tr><td colspan="6" class="text-center py-10 text-gray-500">No missions found matching your criteria.</td></tr>`
                : problems.map(p => {
                    const tagsHTML = (p.tags || []).map(tag => `<span class="inline-block bg-gray-800 border border-gray-700 rounded-full px-2 py-1 text-xs font-semibold text-gray-300 mr-2 mb-1 clickable-tag" onclick="setTagFilter('${tag}')">${tag}</span>`).join('');
                    const contestDate = formatDate(p.startTimeSeconds);

                    let verdictHTML = '';
                    if (settings.compareHandle) {
                        const v1Obj = userData[settings.handle].submissionMap.get(`${p.contestId}-${p.index}`) || {verdict: 'Not Attempted'};
                        const v2Obj = userData[settings.compareHandle].submissionMap.get(`${p.contestId}-${p.index}`) || {verdict: 'Not Attempted'};
                        
                        verdictHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold">
                                <span class="px-2 inline-flex text-xs leading-5 font-bold rounded-full ${getVerdictColor(v1Obj.verdict)[1]}">${v1Obj.verdict}</span>
                                ${v1Obj.solvedDate ? `<div class="text-xs font-medium text-gray-500 mt-1 flex items-center"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>${formatDate(v1Obj.solvedDate)}</div>` : ''}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold">
                                <span class="px-2 inline-flex text-xs leading-5 font-bold rounded-full ${getVerdictColor(v2Obj.verdict)[1]}">${v2Obj.verdict}</span>
                                ${v2Obj.solvedDate ? `<div class="text-xs font-medium text-gray-500 mt-1 flex items-center"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>${formatDate(v2Obj.solvedDate)}</div>` : ''}
                            </td>`;
                    } else {
                        const vObj = userData[settings.handle].submissionMap.get(`${p.contestId}-${p.index}`) || {verdict: 'Not Attempted'};
                        verdictHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold">
                                <span class="px-2 inline-flex text-xs leading-5 font-bold rounded-full ${getVerdictColor(vObj.verdict)[1]}">${vObj.verdict}</span>
                                ${vObj.solvedDate ? `<div class="text-xs font-medium text-gray-500 mt-1 flex items-center"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>${formatDate(vObj.solvedDate)}</div>` : ''}
                            </td>`;
                    }

                    return `<tr class="hover:bg-[#1a1a1a] transition-colors group">
                                <td class="px-6 py-4 whitespace-normal text-sm max-w-xs">
                                    <div class="font-bold text-gray-200 group-hover:text-white transition-colors">${p.contestName}</div>
                                    <div class="text-xs text-orange-500/80 mt-1 flex items-center">
                                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                        ${contestDate}
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm"><a href="https://codeforces.com/problemset/problem/${p.contestId}/${p.index}" target="_blank" class="text-orange-400 hover:text-orange-300 font-bold hover:underline glow-text">${p.name}</a></td>
                                <td class="px-6 py-4 whitespace-normal text-sm max-w-xs">${tagsHTML}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-300">${p.rating || 'N/A'}</td>
                                ${verdictHTML}
                            </tr>`;
                }).join('');
        }
        
        function setTagFilter(tag) { tagFilterInput.value = tag; settings.filters.tag = tag.toLowerCase(); saveSettings(); applyFiltersAndRender(); }
        
        function updateSortIcons() {
            document.querySelectorAll('.sortable').forEach(header => {
                const icon = header.querySelector('.sort-icon');
                if (header.dataset.sort === settings.sort.column) {
                    icon.innerHTML = settings.sort.direction === 'asc' ? '&#9650;' : '&#9660;'; icon.classList.add('active');
                } else { icon.innerHTML = ''; icon.classList.remove('active'); }
            });
        }
        
        function renderMiniProfile(handle, container) {
            const { rating, rank, avatar } = userData[handle].userInfo;
            const rankColor = getRankColor(rank);
            const profileElement = document.createElement('div');
            profileElement.className = 'card p-4 flex items-center space-x-4 flex-1 animate-fade-in relative overflow-hidden';
            profileElement.innerHTML = `
                <div class="absolute -right-4 -top-4 opacity-5 text-8xl text-orange-500 font-black rotate-12 select-none">忍</div>
                <img src="${avatar}" class="w-14 h-14 rounded-full border-2 border-orange-500/50 shadow-[0_0_10px_rgba(255,102,0,0.5)] z-10">
                <div class="flex-grow z-10">
                    <a href="https://codeforces.com/profile/${handle}" target="_blank" class="font-extrabold text-xl ${rankColor} hover:underline">${handle}</a>
                    <p class="text-sm text-gray-400 font-medium uppercase tracking-wide mt-0.5">${rank || 'Genin'} <span class="text-orange-500">•</span> ${rating || 'N/A'}</p>
                </div>
            `;
            container.appendChild(profileElement);
        }

        function renderAnalyticsForUser(handle, container) {
            const userSubmissions = userData[handle].submissions;
            const userSubmissionMap = userData[handle].submissionMap;
            const idSuffix = handle === settings.handle ? '1' : '2';

            container.innerHTML = `
                <div class="card p-6 relative overflow-hidden">
                    <div class="absolute -right-10 -bottom-10 opacity-[0.02] text-[12rem] text-orange-500 font-black">闘</div>
                    <h2 class="text-xl font-bold text-white mb-4 border-b border-orange-500/20 pb-3 relative z-10">Battle Stats: <span class="text-orange-500">${handle}</span></h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 relative z-10">
                        <div>
                            <h3 class="font-bold text-gray-400 uppercase tracking-wider text-xs mb-3 text-center">Verdict Breakdown</h3>
                            <canvas id="verdict-pie-chart-${idSuffix}"></canvas>
                            <div id="verdict-details-${idSuffix}" class="mt-4 space-y-1.5"></div>
                        </div>
                        <div class="flex flex-col justify-center pl-0 sm:pl-4 border-l-0 sm:border-l border-gray-800">
                            <h3 class="font-bold text-gray-400 uppercase tracking-wider text-xs mb-3">Weak Points (Genjutsu)</h3>
                            <div id="weakness-detection-${idSuffix}" class="space-y-2"></div>
                            <h3 class="font-bold text-gray-400 uppercase tracking-wider text-xs mb-3 mt-6">Next Target</h3>
                            <div id="difficulty-suggestion-${idSuffix}" class="text-center bg-[#0a0a0a] border border-orange-500/20 p-4 rounded-lg shadow-inner"></div>
                        </div>
                    </div>
                </div>
                <div class="card p-6">
                     <h2 class="text-xl font-bold text-white mb-4 border-b border-orange-500/20 pb-3">Chakra Progression: <span class="text-orange-500">${handle}</span></h2>
                    <div><h3 class="font-bold text-gray-400 uppercase tracking-wider text-xs mb-3">Missions Completed by Rank</h3><canvas id="rating-distribution-chart-${idSuffix}" height="150"></canvas></div>
                    <div class="mt-8">
                         <h3 class="font-bold text-gray-400 uppercase tracking-wider text-xs mb-3">Target Rating Breakdown</h3>
                         <div id="rating-breakdown-container-${idSuffix}" class="overflow-y-auto max-h-48 pr-2"></div>
                    </div>
                    <div class="mt-8"><h3 class="font-bold text-gray-400 uppercase tracking-wider text-xs mb-3">Jutsu Mastery (Tags)</h3><div id="tag-mastery-container-${idSuffix}" class="space-y-3 overflow-y-auto max-h-56 pr-2"></div></div>
                </div>
            `;
            
            renderVerdictPieChart(currentProblemSelection, userSubmissionMap, `verdict-pie-chart-${idSuffix}`, `verdict-details-${idSuffix}`);
            renderRatingDistributionChart(userSubmissions, `rating-distribution-chart-${idSuffix}`);
            renderRatingBreakdownTable(currentProblemSelection, userSubmissionMap, `rating-breakdown-container-${idSuffix}`);
            renderTagMastery(currentProblemSelection, userSubmissionMap, `tag-mastery-container-${idSuffix}`);
            renderWeaknessDetection(userSubmissions, `weakness-detection-${idSuffix}`);
            renderDifficultySuggestion(currentProblemSelection, userSubmissionMap, `difficulty-suggestion-${idSuffix}`);
        }

        function renderVerdictPieChart(problems, submissionMap, chartId, detailsId) {
            const pieChartVerdictCounts = problems.reduce((acc, p) => {
                const vObj = submissionMap.get(`${p.contestId}-${p.index}`) || { verdict: 'Not Attempted' };
                const simpleVerdict = vObj.verdict === 'Solved' || vObj.verdict === 'Not Attempted' ? vObj.verdict : 'Attempted but Wrong';
                acc[simpleVerdict] = (acc[simpleVerdict] || 0) + 1;
                return acc;
            }, {});
            const ctx = document.getElementById(chartId).getContext('2d');
            if (charts[chartId]) charts[chartId].destroy();
            charts[chartId] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(pieChartVerdictCounts),
                    datasets: [{ 
                        data: Object.values(pieChartVerdictCounts), 
                        backgroundColor: Object.keys(pieChartVerdictCounts).map(v => getVerdictColor(v)[0]), 
                        borderColor: '#141414',
                        borderWidth: 2
                    }]
                },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, cutout: '70%' }
            });

            const detailedVerdictCounts = problems.reduce((acc, p) => {
                const vObj = submissionMap.get(`${p.contestId}-${p.index}`) || { verdict: 'Not Attempted' };
                acc[vObj.verdict] = (acc[vObj.verdict] || 0) + 1;
                return acc;
            }, {});
            document.getElementById(detailsId).innerHTML = Object.entries(detailedVerdictCounts).sort((a,b) => b[1] - a[1]).map(([verdict, count]) => {
                const [colorHex, ] = getVerdictColor(verdict);
                return `<div class="flex justify-between items-center text-sm"><span class="flex items-center"><span class="w-2 h-2 rounded-full mr-2" style="background-color: ${colorHex}; box-shadow: 0 0 5px ${colorHex}"></span><span class="font-medium text-gray-300">${verdict}</span></span><span class="font-bold text-white">${count}</span></div>`;
            }).join('');
        }
        
        function renderRatingDistributionChart(submissions, chartId) {
            const solvedByRating = {};
            submissions.forEach(sub => {
                if(sub.verdict === 'OK') {
                    const problem = allProblems.find(p => p.contestId === sub.problem.contestId && p.index === sub.problem.index);
                    if(problem && problem.rating) solvedByRating[problem.rating] = (solvedByRating[problem.rating] || 0) + 1;
                }
            });
            const sortedRatings = Object.keys(solvedByRating).map(Number).sort((a,b)=> a-b);
            const ctx = document.getElementById(chartId).getContext('2d');
            if(charts[chartId]) charts[chartId].destroy();
            charts[chartId] = new Chart(ctx, {
                type: 'bar',
                data: { 
                    labels: sortedRatings.map(String), 
                    datasets: [{ 
                        label: 'Total Solved', 
                        data: sortedRatings.map(r => solvedByRating[r]), 
                        backgroundColor: '#ff6600',
                        borderRadius: 4
                    }] 
                },
                options: { 
                    scales: { 
                        y: { beginAtZero: true, grid: { color: '#333' }, ticks: { color: '#9ca3af', font: {family: 'Inter', weight: 'bold'} } }, 
                        x: { grid: { display: false }, ticks: { color: '#9ca3af', font: {family: 'Inter', weight: 'bold'} } } 
                    }, 
                    plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1a1a1a', titleColor: '#ff8c00', bodyColor: '#fff', callbacks: { title: ctx => `Rank: ${ctx[0].label}` } } } 
                }
            });
        }

        function renderRatingBreakdownTable(problems, submissionMap, containerId) {
            const ratingData = {};
            problems.forEach(p => {
                if (!p.rating) return;
                if (!ratingData[p.rating]) ratingData[p.rating] = { total: 0, solved: 0 };
                ratingData[p.rating].total++;
                if ((submissionMap.get(`${p.contestId}-${p.index}`) || {}).verdict === 'Solved') {
                    ratingData[p.rating].solved++;
                }
            });
            const sortedRatings = Object.entries(ratingData).sort((a, b) => b[1].total - a[1].total);

            const tableHTML = `
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-400 uppercase bg-[#0a0a0a] sticky top-0 font-bold border-b border-gray-800">
                        <tr>
                            <th scope="col" class="px-4 py-2">Rank</th>
                            <th scope="col" class="px-4 py-2 text-center">My Solved</th>
                            <th scope="col" class="px-4 py-2 text-center">Total Targets</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-800">
                        ${sortedRatings.map(([rating, data]) => `
                            <tr class="hover:bg-[#1f1f1f] transition-colors">
                                <td class="px-4 py-2 font-bold text-gray-200">${rating}</td>
                                <td class="px-4 py-2 text-center font-bold text-orange-500">${data.solved}</td>
                                <td class="px-4 py-2 text-center text-gray-400 font-semibold">${data.total}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById(containerId).innerHTML = tableHTML;
        }
        
        function renderTagMastery(problems, submissionMap, containerId) {
            const tagData = {};
            problems.forEach(p => (p.tags || []).forEach(tag => {
                if(!tagData[tag]) tagData[tag] = { total: 0, solved: 0 };
                tagData[tag].total++;
                if ((submissionMap.get(`${p.contestId}-${p.index}`) || {}).verdict === 'Solved') tagData[tag].solved++;
            }));
            const sortedTags = Object.entries(tagData).sort((a,b) => b[1].total - a[1].total);
            document.getElementById(containerId).innerHTML = sortedTags.slice(0, 10).map(([tag, data]) => {
                const mastery = data.total > 0 ? (data.solved / data.total) * 100 : 0;
                return `<div class="text-sm">
                            <div class="flex justify-between mb-1.5"><span class="font-bold text-gray-300">${tag}</span><span class="text-gray-500 font-mono font-semibold">${data.solved}/${data.total}</span></div>
                            <div class="w-full bg-[#0a0a0a] rounded-full h-2.5 overflow-hidden border border-gray-800">
                                <div class="bg-gradient-to-r from-orange-600 to-orange-400 h-2.5 rounded-full" style="width: ${mastery}%"></div>
                            </div>
                        </div>`;
            }).join('');
        }

        function renderWeaknessDetection(submissions, containerId) {
            const tagData = {};
            submissions.forEach(sub => {
                const p = allProblems.find(p => p.contestId === sub.problem.contestId && p.index === sub.problem.index);
                if (!p || !p.tags) return;
                p.tags.forEach(tag => {
                    if (!tagData[tag]) tagData[tag] = { attempted: new Set(), solved: new Set() };
                    tagData[tag].attempted.add(p.name);
                    if (sub.verdict === 'OK') tagData[tag].solved.add(p.name);
                });
            });
            const weaknesses = Object.entries(tagData).map(([tag, data]) => ({ tag, success: data.attempted.size > 0 ? data.solved.size / data.attempted.size : 0, attempted: data.attempted.size })).filter(item => item.attempted >= 5).sort((a, b) => a.success - b.success);
            document.getElementById(containerId).innerHTML = weaknesses.length > 0
                ? weaknesses.slice(0, 3).map(w => `<div class="text-sm flex justify-between items-center bg-[#1a1a1a] px-3 py-2 rounded-md border-l-2 border-red-500"><span class="text-gray-300 font-bold">${w.tag}</span><span class="text-xs font-mono font-bold text-red-500">${(w.success * 100).toFixed(0)}% success</span></div>`).join('')
                : `<p class="text-sm text-gray-500 italic">Gathering more intel on your weaknesses...</p>`;
        }

        function renderDifficultySuggestion(problems, submissionMap, containerId) {
            const ratingData = {};
            problems.forEach(p => {
                if (!p.rating) return;
                if (!ratingData[p.rating]) ratingData[p.rating] = { total: 0, solved: 0 };
                ratingData[p.rating].total++;
                if ((submissionMap.get(`${p.contestId}-${p.index}`) || {}).verdict === 'Solved') ratingData[p.rating].solved++;
            });
            const sortedRatings = Object.entries(ratingData).sort((a, b) => Number(a[0]) - Number(b[0]));
            let comfortRating = 0;
            for(const [rating, data] of sortedRatings) {
                if (data.total > 2 && (data.solved / data.total) > 0.6) comfortRating = Number(rating);
            }
            document.getElementById(containerId).innerHTML = comfortRating > 0
                ? `<p class="text-sm text-gray-400">You clear >60% of <strong class="text-white">${comfortRating}</strong> rank missions.</p>
                   <p class="text-base font-bold mt-2">Challenge a <span class="text-orange-500 glow-text text-xl ml-1">${comfortRating + 100}</span> target!</p>`
                : `<p class="text-sm text-gray-500 italic">Complete more missions to unlock your next target tier!</p>`;
        }
        
        // --- Utility Functions ---
        function getVerdictColor(verdict) {
            const colors = {
                'Solved': ['#ff6600', 'bg-orange-500/10 text-orange-500 border border-orange-500/30'], // Naruto orange for solved
                'Not Attempted': ['#4b5563', 'bg-gray-800 text-gray-400 border border-gray-700'],
                'Attempted but Wrong': ['#dc2626', 'bg-red-500/10 text-red-500 border border-red-500/30'],
                'WRONG ANSWER': ['#dc2626', 'bg-red-500/10 text-red-500 border border-red-500/30'],
                'TIME LIMIT EXCEEDED': ['#d97706', 'bg-yellow-500/10 text-yellow-500 border border-yellow-500/30'],
                'MEMORY LIMIT EXCEEDED': ['#ea580c', 'bg-amber-500/10 text-amber-500 border border-amber-500/30'],
                'RUNTIME ERROR': ['#7c3aed', 'bg-purple-500/10 text-purple-400 border border-purple-500/30'],
                'COMPILATION ERROR': ['#db2777', 'bg-pink-500/10 text-pink-400 border border-pink-500/30'],
            };
            return colors[verdict] || colors['Attempted but Wrong'];
        }
        function getRankColor(rank) {
            if (!rank) return 'text-gray-500';
            if (rank.includes('Grandmaster')) return 'text-red-600';
            if (rank.includes('Master')) return 'text-orange-400';
            if (rank.includes('Candidate')) return 'text-purple-500';
            if (rank.includes('Expert')) return 'text-blue-500';
            if (rank.includes('Specialist')) return 'text-cyan-500';
            return 'text-green-500';
        }
    </script>
</body>
</html>
